<meta name="theme-color" content="#F7F6F4">

<style>
@font-face{font-family:'DM Serif Display';font-display:swap;font-style:normal;font-weight:400;src:url(/la-marea/fonts/dm-serif-display-latin-400-recortada.woff2) format('woff2')}
@font-face{font-family:'DM Serif Display';font-display:swap;font-style:italic;font-weight:400;src:url(/la-marea/fonts/dm-serif-display-latin-400-cursiva-recortada.woff2) format('woff2')}
@font-face{font-family:'Figtree';font-display:swap;font-style:normal;font-weight:400 700;src:url(/la-marea/fonts/figtree-latin-recortada.woff2) format('woff2')}
:root{--blanco:#F7F6F4; --acuarela:#E2EBF2; --marea:#015B9A; --mar:#0B3047; --tinta:#1B2233; --suave:#4A5468; --carab:#B23A1E; --carab-hover:#952F17; --ease-out:cubic-bezier(.23,1,.32,1)}
*{box-sizing:border-box}
body{margin:0; background:var(--acuarela); color:var(--tinta); font:400 1.0625rem/1.7 'Figtree',system-ui,sans-serif}
.barra{display:flex; justify-content:center; padding:12px 24px; background:var(--blanco); border-bottom:1px solid rgba(27,34,51,.1)}
.barra a{display:block; line-height:0}
.barra img{height:56px; width:auto}
.wrap{max-width:760px; margin:0 auto; padding:56px 24px 96px}
.hoja{background:var(--blanco); border-radius:14px; padding:clamp(24px,5vw,48px); box-shadow:0 22px 44px -32px rgba(11,48,71,.5)}
h1{font:400 clamp(2rem,5vw,2.8rem)/1.14 'DM Serif Display',Georgia,serif; margin:0; color:var(--tinta)}
h1 em{color:var(--marea)}
.fecha{color:var(--suave); font-size:.9375rem; margin:10px 0 30px}
h2{font:700 1.2rem/1.3 'Figtree',system-ui,sans-serif; margin:32px 0 8px; color:var(--marea)}
p{color:var(--suave)}
strong{color:var(--tinta)}
a{color:var(--marea)}
.volver{display:inline-flex; margin-top:32px; padding:15px 24px; background:var(--carab); color:var(--blanco); font-weight:700; text-decoration:none; border-radius:14px; transition:background-color .16s var(--ease-out), transform .12s var(--ease-out)}
.volver:active{transform:scale(.97)}
:focus-visible{outline:3px solid var(--marea); outline-offset:3px}
@media (hover:hover) and (pointer:fine){ .volver:hover{background:var(--carab-hover)} }
@media (prefers-reduced-motion:reduce){ .volver{transition:none} }
a[href^="tel:"]{white-space:nowrap}
</style>
</head>
<body>
<header class="barra"><a href="/la-marea/"><img src="/la-marea/img/logo-la-marea-320.webp" width="320" height="198" alt="La Marea, volver al inicio"></a></header>
<main class="wrap"><div class="hoja">
  <h1>Esta ola no llega a <em>ninguna</em> parte</h1>
  <p class="fecha">La página que buscas no existe: puede que el enlace esté mal o que se haya movido.</p>
  <p>Si quieres reservar mesa o encargar un arroz, llama al <a href="tel:+34616029805">616 02 98 05</a>.</p>
  <a class="volver" href="/la-marea/">Volver al inicio</a>
</div></main>
</body>
</html>
