<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Página no encontrada | Della Grotta Streetfood</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0d0b0a">
<link rel="icon" type="image/svg+xml" href="assets/img/logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{ --negro:#0d0b0a; --rojo:#df2412; --rojo-claro:#ff5a45; --texto:#f5efe6; --muted:#b9afa5; --linea:rgba(245,239,230,.16);
    --ease-out:cubic-bezier(0.23,1,0.32,1);
    --f-display:'Anton','Oswald','Bebas Neue','Arial Narrow',Impact,sans-serif;
    --f-body:'Barlow','Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--negro);color:var(--texto);font-family:var(--f-body);font-size:17px;line-height:1.7;-webkit-font-smoothing:antialiased}
  :focus-visible{outline:3px solid var(--texto);outline-offset:3px}
  a{color:var(--rojo-claro)}
  body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
  .marca{width:72px;height:72px;margin-bottom:18px}
  .marca img{width:100%;height:100%;display:block}
  .codigo{font-family:var(--f-display);font-weight:400;font-size:clamp(5.5rem,20vw,9rem);color:var(--rojo);line-height:1.1;margin:0}
  h1{font-family:var(--f-display);font-weight:400;text-transform:uppercase;line-height:1.14;margin:4px 0 12px;font-size:clamp(1.6rem,5vw,2.2rem)}
  p{color:var(--muted);margin:0 0 30px;max-width:22em}
  .btn{
    background:var(--rojo);color:#fff;text-decoration:none;font-weight:700;padding:16px 28px;min-height:48px;display:inline-flex;align-items:center;
    font-size:16px;transition:filter .15s var(--ease-out),transform .1s var(--ease-out);
    clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px);
  }
  .btn:focus-visible{clip-path:none}
  @media (hover:hover) and (pointer:fine){ .btn:hover{filter:brightness(1.14)} }
  .btn:active{transform:scale(0.97)}
</style>
</head>
<body>
  <div class="marca"><img src="assets/img/logo.svg" alt="Della Grotta" width="72" height="72"></div>
  <p class="codigo">404</p>
  <h1>Esta página no existe</h1>
  <p>Puede que el enlace esté roto o que la página se haya movido.</p>
  <a class="btn" href="/">Volver al inicio</a>
</body>
</html>
