body{margin:0; background:var(--noche); color:var(--texto); font:400 1.0625rem/1.7 'Montserrat',system-ui,sans-serif}

@media (hover:hover) and (pointer:fine){ .volver:hover{background:var(--oro-claro)} }
@media (prefers-reduced-motion:reduce){ .volver{transition:none} }
