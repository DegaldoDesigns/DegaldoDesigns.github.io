<!DOCTYPE html>
<html lang="es">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Demo en degaldodesigns.es/mitto/: rutas absolutas (/mitto/...) para que fuentes, favicon y enlaces funcionen desde cualquier subruta. Al pasar a dominio propio, quitar el prefijo /mitto. -->
<meta name="theme-color" content="#51533E">
<link rel="icon" href="/mitto/img/favicon.png" type="image/png">
<link rel="preload" href="/mitto/fonts/young-serif-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/mitto/fonts/outfit-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:'Young Serif';font-display:swap;font-style:normal;font-weight:400;src:url(/mitto/fonts/young-serif-latin.woff2) format('woff2')}
@font-face{font-family:'Outfit';font-display:swap;font-style:normal;font-weight:100 900;src:url(/mitto/fonts/outfit-latin.woff2) format('woff2')}
:root{--cal:#FBFAF6; --crema:#EFF3E4; --oliva:#6C6E56; --oliva-osc:#51533E; --tinta:#2F3125; --salvia:#AFB297; --acento:#A8233C; --acento-hover:#8E1C31; --ease-out:cubic-bezier(.23,1,.32,1)}
*{box-sizing:border-box}
body{margin:0; background:var(--cal); color:var(--tinta); font:400 1.0625rem/1.65 'Outfit',system-ui,sans-serif}
.barra{display:flex; justify-content:center; padding:10px 24px; background:var(--cal); box-shadow:0 1px 0 rgba(108,110,86,.26)}
.barra a{display:block; width:86px}
.barra img{display:block; width:100%; height:auto}
.wrap{max-width:760px; margin:0 auto; padding:56px 24px 96px}
.hoja{background:var(--crema); padding:clamp(24px,5vw,48px); border-radius:12px}
.filete{display:block; height:5px; max-width:200px; margin:0 0 26px; background:linear-gradient(rgba(108,110,86,.6) 0 0) 0 0 / 100% 1px no-repeat, linear-gradient(rgba(108,110,86,.6) 0 0) 0 100% / 100% 1px no-repeat}
h1{font:400 clamp(2rem,5vw,2.8rem)/1.16 'Young Serif',Georgia,serif; letter-spacing:-.01em; margin:0; color:var(--tinta)}
.fecha{color:var(--oliva); font-size:.9375rem; margin:10px 0 18px}
h2{font:400 1.45rem/1.3 'Young Serif',Georgia,serif; margin:30px 0 8px; color:var(--tinta)}
p{margin:0 0 1em}
a{color:var(--acento); font-weight:600}
.volver{display:inline-flex; margin-top:30px; padding:15px 24px; background:var(--acento); color:var(--cal); font-weight:600; text-decoration:none; border-radius:12px; transition:background-color .16s var(--ease-out), transform .12s var(--ease-out)}
.volver:active{transform:scale(.97)}
:focus-visible{outline:3px solid var(--acento); outline-offset:3px}
@media (hover:hover) and (pointer:fine){ .volver:hover{background:var(--acento-hover)} }
@media (prefers-reduced-motion:reduce){ .volver{transition:none} }
a[href^="tel:"]{white-space:nowrap}
</style>
</head>
<body>
<header class="barra"><a href="/mitto/"><img src="/mitto/img/logo-oliva-320.webp" width="320" height="269" alt="Mitto, bar y buena comida: volver al inicio"></a></header>
<main class="wrap"><div class="hoja">
  <h1>Esta puerta no da al patio</h1>
  <p class="fecha">La página que buscas no existe: puede que el enlace esté mal o que se haya movido.</p>
  <span class="filete" aria-hidden="true"></span>
  <p>Si quieres preguntar por la carta o encargar una tarta, llámanos al <a href="tel:+34600898751">600 89 87 51</a>.</p>
  <a class="volver" href="/mitto/">Volver al inicio</a>
</div></main>
</body>
</html>
