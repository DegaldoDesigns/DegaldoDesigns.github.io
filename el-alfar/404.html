<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página no encontrada | El Alfar</title>
<meta name="description" content="Esta página no existe. Vuelve a la web de El Alfar.">
<meta name="robots" content="noindex">
<link rel="icon" href="assets/img/favicon.png" type="image/png">
<link rel="preload" href="assets/fonts/fraunces-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:'Fraunces';font-style:normal;font-weight:300 700;font-display:swap;src:url(assets/fonts/fraunces-latin.woff2) format('woff2')}
@font-face{font-family:'Fraunces';font-style:italic;font-weight:300 700;font-display:swap;src:url(assets/fonts/fraunces-italic-latin.woff2) format('woff2')}
@font-face{font-family:'Manrope';font-style:normal;font-weight:400 700;font-display:swap;src:url(assets/fonts/manrope-latin.woff2) format('woff2')}
:root{--papel:#f6f1ea;--papel-2:#efe6da;--tinta:#1e1a17;--tinta-2:#5b4f47;--linea:#d9ccbb;--barro:#a8472a;--barro-osc:#8f3a21;
  --f-display:'Fraunces',Georgia,'Times New Roman',serif;--f-body:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;--ease-out:cubic-bezier(0.23,1,0.32,1)}
*{box-sizing:border-box}
body{margin:0;background:var(--papel);color:var(--tinta);font:17px/1.7 var(--f-body)}
.wrap{max-width:720px;margin:0 auto;padding:48px 24px 100px}
.marca img{width:96px;height:auto}
h1{font-family:var(--f-display);font-weight:500;font-size:clamp(36px,6vw,52px);line-height:1.14;letter-spacing:-.02em;margin:36px 0 8px}
h1 em{font-style:italic;font-weight:400;color:var(--barro)}
h2{font-family:var(--f-display);font-weight:500;font-size:22px;line-height:1.25;margin:34px 0 8px}
.fecha{color:var(--tinta-2);font-size:14px;margin:0 0 26px}
p{color:var(--tinta-2);margin:0 0 12px}
a{color:var(--tinta);text-decoration-color:var(--barro);text-underline-offset:3px}
:focus-visible{outline:3px solid var(--barro);outline-offset:3px;border-radius:6px}
.btn{display:inline-flex;align-items:center;min-height:52px;padding:0 26px;border-radius:999px;background:var(--barro);color:#fbf7f1;font:700 15.5px/20px var(--f-body);text-decoration:none;transition:background-color .16s var(--ease-out),transform .12s var(--ease-out)}
.btn:active{transform:scale(.97)}
@media (hover:hover) and (pointer:fine){a:hover{color:var(--barro)}.btn:hover{background:var(--barro-osc);color:#fbf7f1}}
@media (prefers-reduced-motion:reduce){.btn{transition:none}}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
.c404 .anfora{width:70px;height:auto;margin:0 auto}
.c404 .codigo{font-family:var(--f-display);font-style:italic;font-size:22px;color:var(--barro);margin:18px 0 0}
.c404 h1{margin-top:6px}
</style>
</head>
<body>
<main class="c404">
  <img class="anfora" aria-hidden="true" src="assets/img/anfora-barro.svg" alt="" width="70" height="141">
  <p class="codigo">404</p>
  <h1>Esta página <em>no existe</em></h1>
  <p>Puede que el enlace esté roto o que la página se haya movido.</p>
  <p style="margin-top:26px"><a class="btn" href="/">Volver al inicio</a></p>
</main>
</body>
</html>
