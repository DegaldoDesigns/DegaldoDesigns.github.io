<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página no encontrada | Calle 51</title>
<meta name="description" content="Esta página no existe. Vuelve a la web de Calle 51.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#110c0b">
<link rel="icon" href="assets/img/favicon.png" type="image/png">
<link rel="preload" href="assets/fonts/bebas-neue.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/barlow-400.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:'Bebas Neue';font-style:normal;font-weight:400;font-display:swap;src:url(assets/fonts/bebas-neue.woff2) format('woff2')}
@font-face{font-family:'Barlow';font-style:normal;font-weight:400;font-display:swap;src:url(assets/fonts/barlow-400.woff2) format('woff2')}
@font-face{font-family:'Barlow';font-style:normal;font-weight:700;font-display:swap;src:url(assets/fonts/barlow-700.woff2) format('woff2')}
:root{--negro:#110c0b;--crema:#f6ecdc;--crema-2:#cdbba6;--oro:#f2b53a;--oro-claro:#ffd56e;
  --f-display:'Bebas Neue','Arial Narrow',Impact,sans-serif;--f-body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;--ease-out:cubic-bezier(0.23,1,0.32,1)}
*{box-sizing:border-box}
body{margin:0;background:var(--negro);color:var(--crema);font:17px/1.7 var(--f-body)}
.wrap{max-width:720px;margin:0 auto;padding:40px 24px 100px}
.marca img{width:120px;height:auto}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(46px,7vw,68px);line-height:1.12;margin:30px 0 8px}
h1 em{font-style:normal;color:var(--oro)}
h2{font-family:var(--f-display);font-weight:400;font-size:30px;line-height:1.15;margin:34px 0 8px}
.fecha{color:var(--crema-2);font-size:14px;margin:0 0 26px}
p{color:var(--crema-2);margin:0 0 12px}
a{color:var(--crema);text-decoration-color:var(--oro);text-underline-offset:3px}
:focus-visible{outline:3px solid var(--oro-claro);outline-offset:3px;border-radius:6px}
.btn{display:inline-flex;align-items:center;min-height:52px;padding:0 26px;border-radius:10px;background:var(--oro);color:var(--negro);font:700 16px/20px var(--f-body);text-decoration:none;transition:background-color .16s var(--ease-out),transform .12s var(--ease-out)}
.btn:active{transform:scale(.97)}
@media (hover:hover) and (pointer:fine){a:hover{color:var(--oro)}.btn:hover{background:var(--oro-claro);color:var(--negro)}}
@media (prefers-reduced-motion:reduce){.btn{transition:none}}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
.c404 img{width:220px;height:auto;margin:0 auto}
.c404 .codigo{font:700 14px/1 var(--f-body);letter-spacing:.16em;text-transform:uppercase;color:var(--oro);margin:18px 0 0}
.c404 h1{margin-top:8px}
</style>
</head>
<body>
<main class="c404">
  <img src="assets/img/logo-insignia.webp" alt="" width="560" height="478" aria-hidden="true">
  <p class="codigo">Error 404</p>
  <h1>Esta calle <em>no existe</em></h1>
  <p>Puede que el enlace esté roto o que la página se haya movido.</p>
  <p style="margin-top:26px"><a class="btn" href="/">Volver al inicio</a></p>
</main>
</body>
</html>
