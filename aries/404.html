.volver:active{transform:scale(.97)}

@media (hover:hover) and (pointer:fine){ .volver:hover{background:var(--tinta-hover)} }
@media (prefers-reduced-motion:reduce){ .volver{transition:none} }
main{min-height:70vh; display:flex; flex-direction:column; justify-content:center}
.volver{align-self:flex-start}
.codigo{margin:0 0 22px; width:84px; padding:10px; background:var(--negro)}
