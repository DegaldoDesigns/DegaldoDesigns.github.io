<meta name="theme-color" content="#2A1215">

<link rel="preload" href="/manda-carallo/fonts/uncial-antiqua-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/manda-carallo/fonts/atkinson-hyperlegible-next-latin-recortada.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:'Uncial Antiqua';font-display:swap;font-style:normal;font-weight:400;src:url(/manda-carallo/fonts/uncial-antiqua-latin.woff2) format('woff2')}
@font-face{font-family:'Atkinson Hyperlegible Next';font-display:swap;font-style:normal;font-weight:400 700;src:url(/manda-carallo/fonts/atkinson-hyperlegible-next-latin-recortada.woff2) format('woff2')}
:root{--pizarra:#2A1215; --pizarra-2:#381A1D; --crema:#EFE6D2; --crema-apagado:#CDBFA8; --choco:#4E2F25; --choco-suave:#6B4A3C; --madera:#8A4B2A; --cuerda:#D98A2B; --pim:#B23A1A; --pim-claro:#E8794A; --pim-claro-hover:#F0946B; --ease-out:cubic-bezier(.23,1,.32,1)}
*{box-sizing:border-box}
body{margin:0; background:var(--crema); color:var(--choco); font:400 1.0625rem/1.7 'Atkinson Hyperlegible Next',system-ui,sans-serif}
.barra{display:flex; justify-content:center; padding:16px 24px; background:var(--pizarra); border-bottom:4px solid var(--madera)}
.barra a{color:var(--crema); font:400 1.75rem/1.2 'Uncial Antiqua',Georgia,serif; text-decoration:none}
.wrap{max-width:760px; margin:0 auto; padding:56px 24px 96px}
.hoja{background:var(--pizarra); color:var(--crema); border-radius:6px; padding:clamp(24px,5vw,48px); box-shadow:0 22px 44px -30px rgba(42,18,21,.6)}
h1{font:400 clamp(2rem,5vw,2.8rem)/1.16 'Uncial Antiqua',Georgia,serif; margin:0; color:var(--crema)}
.fecha{color:var(--crema-apagado); font-size:.9375rem; margin:10px 0 30px}
h2{font:700 1.25rem/1.3 'Atkinson Hyperlegible Next',system-ui,sans-serif; margin:32px 0 8px; color:var(--pim-claro)}
p{color:var(--crema-apagado)}
strong{color:var(--crema)}
a{color:var(--crema)}
.volver{display:inline-flex; margin-top:32px; padding:15px 24px; background:var(--pim-claro); color:var(--pizarra); font-weight:700; text-decoration:none; border-radius:6px; transition:background-color .16s var(--ease-out), transform .12s var(--ease-out)}
.volver:active{transform:scale(.97)}
:focus-visible{outline:3px solid var(--crema); outline-offset:3px}
@media (hover:hover) and (pointer:fine){ .volver:hover{background:var(--pim-claro-hover)} }
@media (prefers-reduced-motion:reduce){ .volver{transition:none} }
a[href^="tel:"]{white-space:nowrap}
</style>
</head>
<body>
<header class="barra"><a href="/manda-carallo/">Manda Carallo</a></header>
<main class="wrap"><div class="hoja">
  <h1>Esta ración no está en la carta</h1>
  <p class="fecha">La página que buscas no existe: puede que el enlace esté mal o que se haya movido.</p>
  <p>Si quieres reservar mesa, llama al <a href="tel:+34654078823">654 07 88 23</a>.</p>
  <a class="volver" href="/manda-carallo/">Volver al inicio</a>
</div></main>
</body>
</html>
