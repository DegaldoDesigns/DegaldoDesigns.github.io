<style>
@font-face{font-family:"Cinzel";font-display:swap;font-style:normal;font-weight:400 600;src:url(/el-cardenal-gastrobar/fonts/cinzel-latin-recortada.woff2) format("woff2")}
@font-face{font-family:"Jost";font-display:swap;font-style:normal;font-weight:400 600;src:url(/el-cardenal-gastrobar/fonts/jost-latin-recortada.woff2) format("woff2")}
:root{--toldo:#100F0D;--crema:#F3ECE0;--gris:#B3A994;--oro:#BBA76C;--oro-claro:#CDB97F;--papel:#FCFAF6;--tinta:#1C1A17;--gris-papel:#5E574D;--bronce:#BC9566;--bronce-texto:#86663C;--ease-out:cubic-bezier(.23,1,.32,1)}
*{box-sizing:border-box}
body{margin:0;background:var(--toldo);color:var(--crema);font:400 17px/1.7 "Jost",system-ui,sans-serif}
.barra{display:flex;justify-content:center;padding:14px 24px;border-bottom:1px solid rgba(187,167,108,.3)}
.barra a{display:flex;align-items:center;gap:10px;color:var(--crema);text-decoration:none;font:600 17px/1.2 "Cinzel",Georgia,serif;letter-spacing:.08em;text-transform:uppercase}
.barra img{width:40px;height:40px}
.wrap{max-width:760px;margin:0 auto;padding:48px 20px 96px}
.hoja{background:var(--papel);color:var(--tinta);padding:clamp(26px,5vw,52px);border-radius:2px}
h1{font:400 clamp(1.8rem,5vw,2.6rem)/1.18 "Cinzel",Georgia,serif;letter-spacing:.03em;text-transform:uppercase;margin:0}
.fecha{color:var(--gris-papel);font-size:15px;margin:10px 0 28px}
h2{font:600 1.1rem/1.3 "Cinzel",Georgia,serif;letter-spacing:.08em;text-transform:uppercase;color:var(--bronce-texto);margin:32px 0 8px}
p{color:var(--gris-papel)} strong{color:var(--tinta)}
a{color:var(--tinta);font-weight:600}
a:focus-visible{outline:2px solid var(--bronce-texto);outline-offset:3px}
.volver{display:inline-block;margin-top:30px}
</style>
<style>
body{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px}
main{display:grid;justify-items:center;gap:6px}
main img{width:120px;height:120px}
.codigo{margin:0;font:400 clamp(70px,16vw,128px)/1.1 "Cinzel",Georgia,serif;color:var(--oro)}
main p{color:var(--gris);max-width:34ch;margin:0 0 22px}
main h1{color:var(--crema)}
.btn{display:inline-flex;align-items:center;min-height:48px;padding:14px 24px;border-radius:2px;background:var(--oro);color:var(--toldo);font-weight:600;text-decoration:none;transition:background-color .16s var(--ease-out),transform .12s var(--ease-out)}
.btn:active{transform:scale(.97)}
.btn:focus-visible{outline:2px solid var(--crema);outline-offset:3px}
@media (hover:hover) and (pointer:fine){.btn:hover{background:var(--oro-claro)}}
</style>
