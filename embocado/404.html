<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
@font-face{font-family:'Jost';font-display:swap;font-weight:300 600;src:url(/embocado/fonts/jost-latin.woff2) format('woff2')}
@font-face{font-family:'Kaushan Script';font-display:swap;font-weight:400;src:url(/embocado/fonts/kaushan-script-latin.woff2) format('woff2')}
:root{--noche:#0F1F19; --superficie:#16291F; --texto:#F7F3EA; --suave:#BFC7BC; --miel:#E0B566; --miel-claro:#EBC888; --verde:#3DAA35; --linea:rgba(247,243,234,.14); --ease-out:cubic-bezier(0.23,1,0.32,1)}
*{box-sizing:border-box}
body{margin:0; background:var(--noche); color:var(--texto); font:400 1.0625rem/1.7 'Jost',system-ui,sans-serif}
.barra{display:flex; align-items:center; padding:16px 24px; border-bottom:1px solid var(--linea)}
.barra a{font:300 1.6rem/1 'Jost',system-ui,sans-serif; letter-spacing:.06em; color:var(--texto); text-decoration:none}
.barra a b{color:var(--verde); font-weight:300}
.wrap{max-width:740px; margin:0 auto; padding:56px 24px 96px}
h1{font:300 clamp(2.2rem,6vw,3.2rem)/1.14 'Jost',system-ui,sans-serif; margin:0 0 6px}
.fecha{color:var(--suave); font-size:.9375rem; margin:0 0 36px}
h2{font:400 1.75rem/1.2 'Kaushan Script',cursive; margin:36px 0 10px; color:var(--miel)}
p,li{color:var(--suave)}
strong{color:var(--texto)}
a{color:var(--texto)}
.volver{display:inline-flex; margin-top:40px; padding:14px 24px; border-radius:999px; background:var(--miel); color:var(--noche); font-weight:600; text-decoration:none; transition:background-color .16s var(--ease-out), transform .12s var(--ease-out)}
.volver:active{transform:scale(.97)}
:focus-visible{outline:3px solid var(--miel); outline-offset:3px}
@media (hover:hover) and (pointer:fine){ .volver:hover{background:var(--miel-claro)} }
@media (prefers-reduced-motion:reduce){ .volver{transition:none} }
</style>
<style>
main{min-height:70vh; display:flex; flex-direction:column; justify-content:center}
.volver{align-self:flex-start}
.codigo{font:300 clamp(6rem,22vw,10rem)/1 'Jost',system-ui,sans-serif; color:var(--miel); margin:0}
</style>
</head>
<body>
<header class="barra"><a href="/embocado/">embo<b>c</b>ado</a></header>

  <a class="volver" href="/embocado/">Volver al inicio</a>
